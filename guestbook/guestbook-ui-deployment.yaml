apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
        - image: gcr.io/google-samples/gb-frontend:v5
          name: guestbook-ui
          ports:
            - containerPort: 8080
          command:
            - /bin/sh
            - -c
            - |
              sed -i 's/Listen 80/Listen 8080/' /etc/apache2/ports.conf && \
              sed -i 's/:80/:8080/' /etc/apache2/sites-enabled/000-default.conf && \
              apachectl -D FOREGROUND
